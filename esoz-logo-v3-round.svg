<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E4FC0"/>
      <stop offset="1" stop-color="#0A2A7A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="1" stop-color="#F7B500"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="600" cy="600" r="440"/></clipPath>
    <clipPath id="ballClip"><circle cx="600" cy="610" r="104"/></clipPath>
    <path id="arc" d="M222 600 A378 378 0 0 1 978 600"/>
    <g id="wing">
      <path d="M492 440 C392 380 272 380 160 290 C262 470 382 506 492 506 Z"/>
      <path d="M492 512 C402 524 296 566 186 540 C290 618 398 610 492 566 Z"/>
      <path d="M494 574 C428 606 346 656 262 664 C354 700 446 668 494 624 Z"/>
    </g>
  </defs>

  <!-- Rings -->
  <circle cx="600" cy="600" r="540" fill="#0A2A7A"/>
  <circle cx="600" cy="600" r="516" fill="#FFFFFF"/>
  <circle cx="600" cy="600" r="486" fill="url(#gold)"/>
  <circle cx="600" cy="600" r="440" fill="url(#blue)"/>

  <!-- Rays -->
  <g clip-path="url(#disc)" opacity="0.2" fill="#FFD21F">
    <g transform="translate(600 470)">
      <polygon points="0,0 -30,-700 30,-700"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(22.5)"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(45)"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(67.5)"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(90)"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(112.5)"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(135)"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(-22.5)"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(-45)"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(-67.5)"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(-90)"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(-112.5)"/>
      <polygon points="0,0 -30,-700 30,-700" transform="rotate(-135)"/>
    </g>
  </g>

  <!-- Acronym on arc -->
  <text font-family="Montserrat, 'Arial Black', 'DejaVu Sans', sans-serif" font-weight="900" font-size="78" letter-spacing="14" fill="#FFFFFF" text-anchor="middle">
    <textPath href="#arc" startOffset="50%">E.S.O.Z</textPath>
  </text>

  <!-- Wings -->
  <g transform="translate(600 480) scale(0.84) translate(-600 -480)" fill="#FFD21F" stroke="#0A2A7A" stroke-width="7" stroke-linejoin="round">
    <use href="#wing" transform="translate(0 -30)"/>
    <use href="#wing" transform="translate(1200 -30) scale(-1 1)"/>
  </g>

  <!-- Ball -->
  <g transform="translate(600 470) scale(1.2) translate(-600 -610)">
    <circle cx="600" cy="610" r="112" fill="#FFD21F"/>
    <circle cx="600" cy="610" r="104" fill="#FFFFFF"/>
    <g clip-path="url(#ballClip)" fill="#0A2A7A" stroke="#0A2A7A" stroke-width="4" stroke-linejoin="round">
      <polygon points="600,574 634,599 621,639 579,639 566,599"/>
      <path d="M634 599 L688 584 M621 639 L650 690 M579 639 L550 690 M566 599 L512 584 M600 574 L600 506" fill="none"/>
      <polygon points="600,500 628,496 640,470 560,470 572,496"/>
      <polygon points="698,572 722,600 716,640 690,628 684,590"/>
      <polygon points="502,572 478,600 484,640 510,628 516,590"/>
      <polygon points="650,692 676,670 714,690 700,730 660,730"/>
      <polygon points="550,692 524,670 486,690 500,730 540,730"/>
      <polygon points="574,700 626,700 636,740 564,740"/>
    </g>
    <circle cx="600" cy="610" r="104" fill="none" stroke="#0A2A7A" stroke-width="6"/>
  </g>

  <!-- Arabic text -->
  <g font-family="Cairo, Tajawal, Almarai, 'DejaVu Sans', sans-serif" font-weight="900" text-anchor="middle">
    <text x="600" y="716" font-size="56" fill="#FFFFFF">جمعية</text>
    <rect x="170" y="740" width="860" height="124" fill="#FFD21F" stroke="#0A2A7A" stroke-width="7"/>
    <text x="600" y="830" font-size="98" fill="#0A2A7A">النور الرياضي</text>
    <text x="600" y="940" font-size="60" fill="#FFFFFF">بوادي الزرقاء</text>
  </g>
</svg>
